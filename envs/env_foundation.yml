name: scclubench-foundation
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # PyTorch 2.x with CUDA
    - torch==2.1.2
    - torchvision==0.16.2
    - torchaudio==2.1.2
    # Core scientific stack
    - numpy==1.24.3
    - scipy==1.10.1
    - scikit-learn==1.3.2
    - pandas==2.0.3
    - matplotlib==3.7.5
    - seaborn==0.12.2
    # Single-cell
    - scanpy==1.10.0
    - anndata==0.10.5
    - leidenalg==0.11.0
    - louvain==0.8.1
    # Foundation model packages
    - scgpt
    - geneformer
    # Utils
    - munkres==1.1.4
    - tqdm==4.66.1
    - loguru==0.7.2
    - pyyaml==6.0.1
    - h5py==3.10.0
